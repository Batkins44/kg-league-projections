name: Refresh projections

on:
  schedule:
    # Daily at 10:00 UTC: 5 AM Central in summer, 4 AM in winter. Last night's games are final by then.
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "scoring.json"
      - "prior/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Fetch NHL stats
        run: python nhl_fetch.py

      - name: Build projections
        run: python build.py

      - name: Commit results
        run: |
          git config user.name "projections-bot"
          git config user.email "projections-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh projections $(date -u +%Y-%m-%d)"
            git push
          fi
