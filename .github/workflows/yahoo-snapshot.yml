name: Yahoo snapshot

on:
  schedule:
    # Ahead of each hockey routine, in Central winter time (add an hour in summer): 10:35 AM,
    # 12:35 PM (for 12:49), 2:35, 3:35, 4:35 PM (for 4:46 and the 5:15 goalie re-check) and
    # 7:35 PM (for 8:47). GitHub can start scheduled runs 10 to 30 minutes late, hence the lead.
    - cron: "35 16,18,20,21,22 * * *"
    - cron: "35 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shares the refresh lock so the two never push over each other.
  group: refresh
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Yahoo team
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python yahoo_fetch.py

      - name: Commit snapshot
        run: |
          git config user.name "projections-bot"
          git config user.email "projections-bot@users.noreply.github.com"
          [ -d data/yahoo ] || { echo "No snapshot written"; exit 0; }
          git add data/yahoo
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Yahoo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
