name: Yahoo snapshot

on:
  schedule:
    # Every half hour from 7 AM to 8:35 PM Central winter time (add an hour in summer), which
    # covers every hockey routine (12:49, 4:46, 5:13 and 8:47). GitHub starts scheduled runs
    # hours late and drops some outright (on Oct 31 the 01:35 run started at 07:28, and of the
    # 16:35 and 18:35 runs only one ran, at 20:14), so a dense schedule is what keeps the snapshot
    # inside the routines' freshness windows. Runs take about 15 seconds.
    - cron: "5,35 13-23 * * *"
    - cron: "5,35 0-2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shares the refresh lock so the two never push over each other.
  group: refresh
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Fetch Yahoo team
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python yahoo_fetch.py

      - name: Commit snapshot
        run: |
          git config user.name "projections-bot"
          git config user.email "projections-bot@users.noreply.github.com"
          [ -d data/yahoo ] || { echo "No snapshot written"; exit 0; }
          # Runs on other branches are test runs: the fetch log is the result, nothing is pushed.
          [ "$GITHUB_REF_NAME" = main ] || { echo "Test run on $GITHUB_REF_NAME; not committing"; exit 0; }
          git add data/yahoo
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Yahoo snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
